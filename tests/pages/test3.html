<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Before script</title>
<style>
body { font-family: sans-serif; margin: 24px; background: #f3f2f1; }
.card { background: #fff; width: 440px; padding: 32px 44px; box-shadow: 0 2px 6px rgba(0,0,0,.2); }
h1 { font-size: 24px; font-weight: 600; margin: 0 0 16px; }
#out { color: #0067b8; margin-top: 12px; }
</style></head>
<body>
<div class="card">
<h1>JavaScript test</h1>
<p id="out">Script has not run.</p>
<ul id="list"></ul>
</div>
<script>
var items = [];
for (var i = 1; i <= 5; i++) items.push(i * i);
document.getElementById('out').textContent = 'Script ran: squares ' + items.join(', ') + '; 0.1 + 0.2 = ' + (0.1 + 0.2);
var list = document.getElementById('list');
['Amiga', 'WebCore', 'JavaScriptCore'].forEach(function (name) {
  var li = document.createElement('li'); li.textContent = name + ' (' + name.length + ' letters)'; list.appendChild(li);
});
document.title = 'After script: ' + JSON.stringify({ ok: true, n: items.length });
setTimeout(function () { document.getElementById('out').style.fontWeight = 'bold'; alert('Timer fired'); }, 200);
</script>
</body></html>
