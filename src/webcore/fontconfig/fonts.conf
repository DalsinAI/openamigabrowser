<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  OpenBrowser's font configuration (fontconfig), read from
  PROGDIR:fontconfig/fonts.conf. Fonts live in PROGDIR:Fonts.
  MIT, Copyright (c) 2026 Dalsin Limited.
-->
<fontconfig>
  <dir>PROGDIR:Fonts</dir>
  <cachedir>T:fontconfig</cachedir>

  <!-- CSS generic families -->
  <alias binding="same">
    <family>sans-serif</family>
    <prefer><family>Liberation Sans</family><family>DejaVu Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>serif</family>
    <prefer><family>Liberation Serif</family><family>DejaVu Serif</family></prefer>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <prefer><family>Liberation Mono</family><family>DejaVu Sans Mono</family></prefer>
  </alias>
  <alias binding="same">
    <family>system-ui</family>
    <prefer><family>Liberation Sans</family><family>DejaVu Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>cursive</family>
    <prefer><family>Liberation Serif</family></prefer>
  </alias>
  <alias binding="same">
    <family>fantasy</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>

  <!-- Faces pages ask for by name, mapped to the Liberation faces that share
       their metrics, so text lays out at the size the page expects. -->
  <alias binding="same"><family>Arial</family><accept><family>Liberation Sans</family></accept></alias>
  <alias binding="same"><family>Helvetica</family><accept><family>Liberation Sans</family></accept></alias>
  <alias binding="same"><family>Helvetica Neue</family><accept><family>Liberation Sans</family></accept></alias>
  <alias binding="same"><family>Segoe UI</family><accept><family>Liberation Sans</family></accept></alias>
  <alias binding="same"><family>Roboto</family><accept><family>Liberation Sans</family></accept></alias>
  <alias binding="same"><family>Verdana</family><accept><family>DejaVu Sans</family></accept></alias>
  <alias binding="same"><family>Tahoma</family><accept><family>DejaVu Sans</family></accept></alias>
  <alias binding="same"><family>Times New Roman</family><accept><family>Liberation Serif</family></accept></alias>
  <alias binding="same"><family>Times</family><accept><family>Liberation Serif</family></accept></alias>
  <alias binding="same"><family>Georgia</family><accept><family>Liberation Serif</family></accept></alias>
  <alias binding="same"><family>Courier New</family><accept><family>Liberation Mono</family></accept></alias>
  <alias binding="same"><family>Courier</family><accept><family>Liberation Mono</family></accept></alias>
  <alias binding="same"><family>Consolas</family><accept><family>Liberation Mono</family></accept></alias>

  <!-- Grey-scale anti-aliasing with light hinting suits Amiga screens. -->
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>
</fontconfig>
